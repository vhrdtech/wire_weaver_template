[package]
name = "driver"
version = "0.1.0"
edition = "2024"

[dependencies]
api = { path = "../api" }
wire_weaver = { workspace = true }
wire_weaver_client_common = { version = "0.1.0" }
wire_weaver_usb_host = { version = "0.1.0" }
ww_client_server = { version = "0.1.0" }
tokio = { version = "1", features = ["sync", "rt"] }

[dev-dependencies]
clap = { version = "4.5", features = ["derive"] }
clap-repl = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
console = "0.16"
tracing-subscriber = "0.3"
tracing = "0.1"
anyhow = "1"
